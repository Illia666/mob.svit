<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobil Svit — аксесуари для смартфонів: чохли, скло, зарядки, кабелі</title>
  <meta name="description" content="Mobil Svit: чохли, захисне скло, зарядні пристрої, кабелі та аксесуари для всіх моделей смартфонів. Актуальні ціни та наявність, доставка по Україні.">
  <meta name="theme-color" content="#10151f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Перейти до вмісту</a>

<header class="header" id="header">
  <div class="top">
    <a class="logo" href="#/" id="logo" aria-label="Mobil Svit — на головну">
      <span class="logo-mark" aria-hidden="true">M</span>
      <span class="logo-text">Mobil <b>Svit</b></span>
    </a>
    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Модель, назва або артикул — наприклад, iPhone 16 Pro, S25 Ultra" aria-label="Пошук товарів" autocomplete="off">
      <button id="clearSearch" type="button" class="clear-btn" hidden aria-label="Очистити пошук">×</button>
    </div>
    <button id="cartBtn" type="button" class="cart-btn" aria-label="Кошик">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span class="cart-label">Кошик</span><b id="cartCount">0</b>
    </button>
  </div>

  <nav class="navbar" aria-label="Каталог">
    <div class="navbar-inner">
      <button type="button" class="cat-btn" id="catBtn" aria-expanded="false" aria-controls="catDrop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span>Каталог товарів</span>
      </button>
      <ul class="brand-strip" id="brandList" aria-label="Бренди смартфонів"></ul>
      <div class="nav-ctas">
        <button type="button" class="nav-cta arr" id="arrBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18.5" r="1.4"/><circle cx="17" cy="18.5" r="1.4"/></svg>
          <span>Надходження</span>
        </button>
        <button type="button" class="nav-cta nov" id="newBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 5 5.6.8-4 3.9.9 5.5L12 15.6 7.1 18.2 8 12.7 4 8.8 9.6 8z"/></svg>
          <span>Новинки</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="cat-drop" id="catDrop" hidden></div>

  <div class="mega-menu" id="megaMenu" hidden>
    <div class="mega-inner">
      <div class="mega-head">
        <strong id="megaTitle">Моделі</strong>
        <button type="button" class="all-brand-btn" id="allBrandBtn">Усі товари бренду</button>
        <div class="mega-sort">
          <button type="button" class="pill active" data-msort="default">За серіями</button>
          <button type="button" class="pill" data-msort="alpha">За алфавітом</button>
        </div>
        <input type="search" id="megaSearch" class="mega-search" placeholder="Пошук серед моделей…" aria-label="Пошук серед моделей">
        <button type="button" class="mega-close" id="megaClose" aria-label="Закрити">×</button>
      </div>
      <div class="mega-cols" id="megaCols"></div>
    </div>
  </div>
</header>
<div class="scrim" id="scrim" hidden></div>

<main id="main">
  <!-- ГОЛОВНА -->
  <section id="home" aria-label="Головна">
    <h1 class="sr">Mobil Svit — аксесуари для смартфонів</h1>
    <div class="hero">
      <aside class="hero-cat" id="heroCat" aria-label="Категорії"></aside>
      <div class="slider" id="slider" role="region" aria-roledescription="карусель" aria-label="Акції та добірки"></div>
    </div>

    <section class="shelf" aria-labelledby="newTitle">
      <div class="shelf-head">
        <h2 id="newTitle">Новинки</h2>
        <button type="button" class="link-btn" id="allNewBtn">Усі новинки</button>
      </div>
      <div id="newGrid" class="grid"></div>
    </section>
  </section>

  <!-- КАТАЛОГ -->
  <section id="catalogView" hidden aria-label="Каталог">
    <div class="page-head">
      <nav class="crumbs" aria-label="Навігація"><a href="#/" id="crumbHome">Головна</a><span aria-hidden="true">/</span><span id="crumbNow">Каталог</span></nav>
      <div class="title-row">
        <h1 id="viewTitle">Усі товари</h1>
        <button type="button" id="resetModelBtn" class="reset-btn" hidden>Скинути фільтр ×</button>
      </div>
      <p id="viewNote" class="view-note" hidden></p>
    </div>

    <div class="bar">
      <label class="field" id="catField" hidden><span>Категорія</span>
        <select id="cat" aria-label="Категорія"><option value="">Усі категорії</option></select>
      </label>
      <div class="field facet" id="fColorField" hidden><span>Колір</span>
        <div id="fColor" class="fsw" role="group" aria-label="Колір"></div>
      </div>
      <label class="field facet" id="fBrandField" hidden><span>Бренд</span>
        <select id="fBrand" aria-label="Бренд"></select>
      </label>
      <label class="field facet" id="fFormField" hidden><span>Форм-фактор чохла</span>
        <select id="fForm" aria-label="Форм-фактор чохла"></select>
      </label>
      <label class="field"><span>Сортування</span>
        <select id="sort" aria-label="Сортування">
          <option value="">За замовчуванням</option>
          <option value="asc">Спочатку дешевші</option>
          <option value="desc">Спочатку дорожчі</option>
        </select>
      </label>
      <label class="chk"><input id="stock" type="checkbox" checked><span>Лише в наявності</span></label>
      <span id="count" role="status" aria-live="polite"></span>
    </div>
    <div id="typeChips" class="chips" hidden></div>

    <div id="grid" class="grid"></div>
    <button id="more" type="button" class="more-btn" hidden>Показати ще</button>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <a class="logo" href="#/" aria-label="На головну"><span class="logo-mark" aria-hidden="true">M</span><span class="logo-text">Mobil <b>Svit</b></span></a>
    <p>Аксесуари для смартфонів. Ціни та наявність оновлюються автоматично кілька разів на добу.</p>
  </div>
</footer>

<dialog id="pd"></dialog>

<dialog id="cartD">
  <form method="dialog"><button class="x" aria-label="Закрити">×</button></form>
  <h2>Кошик</h2>
  <div id="lines"></div>
  <form id="order" hidden>
    <input name="name" placeholder="Ім'я" required minlength="2" autocomplete="name">
    <input name="phone" type="tel" placeholder="Телефон" required autocomplete="tel">
    <textarea name="comment" rows="2" placeholder="Місто, відділення Нової пошти, коментар"></textarea>
    <button class="buy">Оформити замовлення</button>
    <p id="msg" role="status"></p>
  </form>
</dialog>

<script src="models_data.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
